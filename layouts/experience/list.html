{{ define "main" }}
<main class="section-main">
    <section class="section-page">
        {{ partial "section/header" . }}
        <ol class="section-list">
            {{ range .Pages.ByDate.Reverse }}
            <li class="section-entry-item">
                {{ partial "section/entry" (dict "page" . "dateFormat" "Jan 2006" "showRange" true) }}
            </li>
            {{ else }}
            <li class="section-empty">Nothing here yet.</li>
            {{ end }}
        </ol>
    </section>
</main>
{{ end }}
