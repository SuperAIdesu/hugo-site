{{ define "main" }}
<main class="section-main" aria-label="{{ .Title }}">
    <section class="section-page">
        <ol class="section-list">
            {{ range .Pages.ByDate.Reverse }}
            <li class="section-entry-item">
                {{ partial "section/entry" (dict "page" . "dateFormat" "Jan 2, 2006" "showRange" false) }}
            </li>
            {{ else }}
            <li class="section-empty">Nothing here yet.</li>
            {{ end }}
        </ol>
    </section>
</main>
{{ end }}
