# Your full site URL. Example:
# "https://<username>.neocities.org/"
baseURL = "https://kei.sbeam.dev/"
locale = "en-us"
# Title of your site
title = "Kei's site"
# Theme (must match the folder name under themes/)
theme = "neofeed"
# How many feed entries to load at once
pagination.pagerSize = 6

[markup.goldmark.renderer]
# Neofeed passes .Summary through markdownify; allow the generated HTML to render.
unsafe = true

[taxonomies]
tag = "tags"

[params.author]
name = "Kei Tang" # Your online name
# Your profile image. External link or relative to static/. Examples:
# "https://imgur.com/123456788"
# "image/me.webp"
image = "https://files.seeusercontent.com/2026/11/17/ey2B/smaller_0807.jpg"
about = "TODO: an about section"

[params]
# Name of a file in the theme's static/skins/ without the ".css" extension
# Available: breeze, catppuccin, macintosh, cloudy-day, minimal
skin = "catppuccin"
# Site-owned stylesheet loaded after the skin, relative to ./static/
customCSS = "css/sections.css"
# Sections shown in the home feed, newest first. Other sections (experience,
# projects, talks) get their own pages and are excluded from the timeline.
mainSections = ["posts"]

# Social links rendered as icon buttons in the about card.
# TODO: replace the LinkedIn and WriteFreely URLs with your own profiles.
[[params.social]]
name = "Tangled"
url = "https://tangled.org/superaidesu.tngl.sh"
icon = "tangled"

[[params.social]]
name = "GitHub"
url = "https://github.com/SuperAIdesu"
icon = "github"

[[params.social]]
name = "LinkedIn"
url = "https://www.linkedin.com/in/kei-t-200204234/"
icon = "linkedin"

[[params.social]]
name = "WriteFreely"
url = "https://writee.org/superai/"
icon = "writefreely"

#
# Totally optional cool stuff (see README for details)
#
# socialImage = "static/img/social.png" # site image for rich embeds
# plausible = true
# paymentPointer = "$wallet.provider.com/myspecialid123"
# webmentionUrl = "https://webmention.io/example/webmention"
# pingbackUrl = "https://webmention.io/example/xmlrpc"
# micropubUrl = "https://example.com/.netlify/functions/micropub"
# microsubUrl = "https://aperture.p3k.io/microsub/example"

#
# For IndieAuth and the author card
#
# githubuser = "chihiro"
# twitteruser = "chihiro" # no @ in front
# mastodon = "https://mastodon.technology/@chihiro" # full link to your instance profile

# Site navigation. Entries render as a Plasma task manager in the header,
# sorted by weight. The icon name refers to a Breeze icon in the theme.
[[menus.main]]
name = "Experience"
pageRef = "/experience"
weight = 10
  [menus.main.params]
  icon = "calendar"

[[menus.main]]
name = "Projects"
pageRef = "/projects"
weight = 20
  [menus.main.params]
  icon = "folder"

[[menus.main]]
name = "Talks"
pageRef = "/talks"
weight = 30
  [menus.main.params]
  icon = "presentation"

[permalinks]
# Format for feed entry links. You probably don't need to change this.
feed = "/:title/"

[outputs]
# Output formats for your feed. You probably don't need to change this.
home = ["HTML", "RSS"]
